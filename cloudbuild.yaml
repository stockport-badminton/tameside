# Build → push → deploy pipeline for the tameside-site Cloud Run service.
#
# This file is the source of truth for deploys. The push-to-main trigger
# (rmgpgab-tameside-site-europe-west2-stockport-badminton-tamesdpb) points at it.
# It replaces the inline config that trigger used to carry, which ran
# `docker build --no-cache` and so rebuilt every layer — including `npm ci` and two
# apt installs — on every single deploy.
#
# Caching: the previous `:latest` image is imported as a BuildKit cache source, and
# each build re-exports its own layer metadata via BUILDKIT_INLINE_CACHE so the next
# build can read it. Deploys that don't touch package*.json skip `npm ci` entirely.
# The first build after adopting this file has no cache to import (only :$COMMIT_SHA
# tags exist today, no :latest) — BuildKit warns and builds cold, then seeds :latest.
#
# Manual run: gcloud builds submit --region=global --config cloudbuild.yaml
# COMMIT_SHA is only populated for trigger builds, so the tag falls back to BUILD_ID.
#
# Note on style: substitutions are handed to the steps through explicit `env:` entries
# rather than being referenced inside the `script:` bodies. Cloud Build interpolates
# `env:` values, so the script bodies are plain bash with no $$-escaping and no
# reliance on automapSubstitutions covering built-ins like PROJECT_ID.

substitutions:
  _AR_HOSTNAME: europe-west2-docker.pkg.dev
  _DEPLOY_REGION: europe-west2
  _SERVICE_NAME: tameside-site
  _IMAGE_PATH: cloud-run-source-deploy/tameside/tameside-site
  # Instance ceiling. Declared here rather than left to the service's stored value,
  # because the product of this and the DB pool size is a hard limit on the far side
  # of the connection — see utils/db_connect.js. Unset, Cloud Run defaults to 100,
  # which at max 5 connections each is 500 clients against 60 Postgres backends.
  # 4 x 5 = 20, and at containerConcurrency 80 that is still 320 concurrent requests.
  _MAX_INSTANCES: '4'

options:
  logging: CLOUD_LOGGING_ONLY
  # Loose: the trigger also passes _PLATFORM and _TRIGGER_ID, which this file
  # doesn't reference, and COMMIT_SHA is empty for manual submits.
  substitutionOption: ALLOW_LOOSE
  env:
    - DOCKER_BUILDKIT=1

steps:
# Resolve the tags once and hand them to the later steps via /workspace, which is
# shared across steps. The commit SHA gives an immutable tag per deploy; :latest is
# a moving pointer used only as a build cache source.
- id: Tag
  name: gcr.io/cloud-builders/docker
  env:
    - 'BASE=${_AR_HOSTNAME}/${PROJECT_ID}/${_IMAGE_PATH}'
    - 'SHA=${COMMIT_SHA}'
    - 'BID=${BUILD_ID}'
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    echo "${BASE}:${SHA:-$BID}" > /workspace/image
    echo "${BASE}:latest"      > /workspace/image_latest
    echo "image:  $(cat /workspace/image)"
    echo "cache:  $(cat /workspace/image_latest)"

- id: Build
  name: gcr.io/cloud-builders/docker
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    IMAGE="$(cat /workspace/image)"
    LATEST="$(cat /workspace/image_latest)"
    docker build \
      --cache-from "$LATEST" \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t "$IMAGE" \
      -t "$LATEST" \
      -f Dockerfile .

# Both tags are pushed: :$COMMIT_SHA is what the Cloud Run revision pins to, :latest
# exists only so the next build can read its inline cache. Dropping the :latest push
# silently reverts every future build to cold.
- id: Push
  name: gcr.io/cloud-builders/docker
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    docker push "$(cat /workspace/image)"
    docker push "$(cat /workspace/image_latest)"

# gcr.io/cloud-builders/gcloud rather than cloudsdktool/cloud-sdk:slim. Both carry a
# current gcloud (575 vs 577 at time of writing), but the cloud-builders images are
# pre-cached on Cloud Build workers, so this pulls in 0.0s instead of ~34s — measured
# at roughly a third of the whole pipeline. cloud-sdk:alpine is ~13s, still not free.
- id: Deploy
  name: gcr.io/cloud-builders/gcloud
  env:
    - 'SERVICE=${_SERVICE_NAME}'
    - 'REGION=${_DEPLOY_REGION}'
    - 'SHA=${COMMIT_SHA}'
    - 'BID=${BUILD_ID}'
    - 'MAX_INSTANCES=${_MAX_INSTANCES}'
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    LABELS="managed-by=gcp-cloud-build-deploy-cloud-run,gcb-build-id=${BID}"
    if [ -n "${SHA:-}" ]; then
      LABELS="${LABELS},commit-sha=${SHA}"
    fi
    gcloud run services update "$SERVICE" \
      --platform=managed \
      --region="$REGION" \
      --image="$(cat /workspace/image)" \
      --labels="$LABELS" \
      --max-instances="$MAX_INSTANCES" \
      --quiet

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - tameside-site
